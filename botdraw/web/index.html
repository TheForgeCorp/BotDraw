<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BotDraw Dev Lab</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="bg"></div>
  <header class="top">
    <div class="brand">
      <span class="mark">BotDraw</span>
      <span class="tag">dev lab · vectorization / color layers / JSON export</span>
    </div>
    <nav class="tabs" id="tabs">
      <button data-app="genartbot" class="active">GenArt</button>
      <button data-app="portraitbot">Portrait</button>
      <button data-app="lettersbot">Letters</button>
      <button data-app="rdlab">R&amp;D</button>
      <button data-app="palettes">Palettes</button>
      <button data-app="tools">Tools</button>
    </nav>
  </header>

  <main class="layout lab" id="lab-shell">
    <section class="panel controls" id="controls"></section>

    <section class="panel stage">
      <div class="stage-head">
        <h2 id="stage-title">Emulator</h2>
        <div class="stats" id="stats">Ready</div>
      </div>
      <canvas id="emu" width="900" height="1200"></canvas>
      <div class="transport">
        <button id="play">Play</button>
        <button id="pause">Pause</button>
        <button id="skip">Skip end</button>
        <label>Speed <input id="speed" type="range" min="1" max="60" value="16" /></label>
        <label class="chk"><input id="ghost" type="checkbox" checked /> pen-up ghost</label>
        <a id="download-svg" class="link" href="#" hidden>SVG</a>
      </div>
      <div class="export-bar">
        <button id="export-pack" disabled>Export pack JSON</button>
        <button id="export-settings" disabled>Settings JSON</button>
        <button id="export-layers" disabled>Layers JSON</button>
        <button id="export-motion" disabled>Motion JSON</button>
        <button id="export-palette" disabled>Palette JSON</button>
        <button id="copy-json" disabled>Copy inspector JSON</button>
      </div>
    </section>

    <section class="panel inspector">
      <div class="insp-tabs">
        <button data-insp="layers" class="active">Layers</button>
        <button data-insp="json">JSON</button>
        <button data-insp="job">Job</button>
      </div>
      <div id="inspector-body" class="inspector-body">
        <p class="muted">Render a job to inspect color layers, pens, and vectorization stats.</p>
      </div>
    </section>
  </main>

  <main class="letters-lab" id="letters-shell" hidden>
    <header class="letters-top">
      <div class="letters-identity">
        <span class="letters-mark">Letters</span>
        <span class="letters-sub">Dev panel</span>
      </div>
      <div class="letters-stats" id="letters-stats" aria-live="polite">Ready</div>
    </header>

    <div class="letters-grid">
      <aside class="letters-left panel">
        <div class="letters-left-split">
          <nav class="type-rail" id="letter-types" aria-label="Letter types">
            <button type="button" data-type="professional">Professional</button>
            <button type="button" data-type="marketing">Marketing</button>
            <button type="button" data-type="envelopes">Envelopes</button>
            <button type="button" data-type="personal" class="active">Personal</button>
            <button type="button" data-type="invitations">Invitations</button>
            <button type="button" data-type="postcards">Postcards</button>
          </nav>
          <div class="letter-content" id="letter-content"></div>
        </div>
      </aside>

      <section class="letters-center panel">
        <div class="center-head">
          <h2>Layers</h2>
          <p class="muted">Pen by pass</p>
        </div>
        <div class="layer-tabs" id="letter-layer-tabs"></div>
        <div class="layer-specs" id="letter-layer-specs">
          <p class="muted">Vectorize to inspect pens.</p>
        </div>
      </section>

      <section class="letters-right panel">
        <div class="paper-controls">
          <label>Size
            <select id="letters-paper">
              <option value="A5" selected>A5</option>
              <option value="A4">A4</option>
              <option value="Letter">Letter</option>
              <option value="A3">A3</option>
              <option value="Card">Card</option>
            </select>
          </label>
          <label>Orientation
            <select id="letters-orientation">
              <option value="portrait" selected>Portrait</option>
              <option value="landscape">Landscape</option>
            </select>
          </label>
          <label>Margin
            <select id="letters-margin">
              <option value="12">12 mm</option>
              <option value="18" selected>18 mm</option>
              <option value="24">24 mm</option>
            </select>
          </label>
        </div>
        <div class="paper-frame" id="paper-frame">
          <canvas id="letters-emu" width="740" height="1050"></canvas>
          <div class="print-limit" id="print-limit" aria-hidden="true"></div>
        </div>
        <div class="letters-transport">
          <button type="button" id="letters-play">Play</button>
          <button type="button" id="letters-pause">Pause</button>
          <button type="button" id="letters-skip">End</button>
          <label class="speed-label">Speed <input id="letters-speed" type="range" min="1" max="60" value="16" /></label>
        </div>
        <div class="letters-download">
          <button type="button" class="primary" id="letters-dl-svg" disabled>Download SVG</button>
          <button type="button" id="letters-dl-motion" disabled>Motion JSON</button>
          <button type="button" id="letters-dl-pack" disabled>Pack</button>
        </div>
      </section>
    </div>
  </main>

  <script src="/static/emulator.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
