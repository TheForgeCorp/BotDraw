<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BotDraw Dev Lab</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body data-app="genartbot">
  <!--
    THESIS: Paper on a desk with linework drawing — not a button dashboard.
    OWN-WORLD: Apple-Operate; system gray desk #f5f5f7, white sheet, near-black ink, hairline chrome, SF/system UI.
    STORY: Operator picks an app, tunes compact controls, watches ink draw on a real paper sheet, exports for the plotter.
    FIRST VIEWPORT: Top segmented tabs; left ~300px rail; right large desk with elevated paper + thin toolbar.
    FORM: Apple-canvas Operate (Final Cut / Preview / Photos craft bar); seed apple-devlab-shell-5528; user-pinned.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
  -->
  <header class="top" id="top">
    <div class="brand">
      <span class="mark">BotDraw</span>
      <span class="tag">Dev Lab</span>
    </div>
    <nav class="tabs" id="tabs" aria-label="Apps">
      <button type="button" data-app="genartbot" class="active">GenArt</button>
      <button type="button" data-app="fractalbot">Fractal</button>
      <button type="button" data-app="portraitbot">Portrait</button>
      <button type="button" data-app="lettersbot">Letters</button>
      <button type="button" data-app="rdlab">R&amp;D</button>
      <button type="button" data-app="papers">Paper</button>
      <button type="button" data-app="palettes">Pens</button>
      <button type="button" data-app="lines">Lines</button>
      <button type="button" data-app="tools">Tools</button>
    </nav>
  </header>

  <main class="devlab" id="devlab-shell">
    <aside class="rail panel" id="rail">
      <div class="rail-pane" id="controls" data-rail="lab"></div>
      <div class="rail-pane" id="portrait-content" data-rail="portrait" hidden></div>
      <div class="rail-pane letters-rail" id="letters-rail" data-rail="letters" hidden>
        <nav class="type-rail" id="letter-types" aria-label="Letter types">
          <button type="button" data-type="professional">Professional</button>
          <button type="button" data-type="marketing">Marketing</button>
          <button type="button" data-type="envelopes">Envelopes</button>
          <button type="button" data-type="personal" class="active">Personal</button>
          <button type="button" data-type="invitations">Invitations</button>
          <button type="button" data-type="postcards">Postcards</button>
        </nav>
        <div class="letter-content" id="letter-content"></div>
      </div>
      <div class="rail-inspector" id="rail-inspector" data-rail-inspector hidden>
        <div class="seg insp-tabs" id="insp-tabs">
          <button type="button" data-insp="layers" class="active">Layers</button>
          <button type="button" data-insp="json">JSON</button>
          <button type="button" data-insp="job">Job</button>
        </div>
        <div id="inspector-body" class="inspector-body">
          <p class="muted">Render a job to inspect layers, pens, and stats.</p>
        </div>
      </div>
    </aside>

    <section class="stage" id="stage">
      <div class="stage-head">
        <div class="seg stage-seg" id="stage-seg" hidden>
          <button type="button" data-seg="source">Source</button>
          <button type="button" data-seg="ingest">Ingest</button>
          <button type="button" data-seg="vector" class="active">Vector</button>
        </div>
        <div class="stats" id="stats" aria-live="polite">Ready</div>
      </div>

      <div class="paper-desk is-empty" id="paper-desk">
        <div class="sheet-empty" id="sheet-empty">Drop a photo or Vectorize</div>
        <!-- GenArt / R&D / libraries -->
        <div class="sheet-wrap" id="lab-sheet" data-stage="lab">
          <div class="paper-sheet" id="lab-emu-frame">
            <canvas id="emu" width="900" height="1200"></canvas>
          </div>
        </div>

        <!-- Letters -->
        <div class="sheet-wrap" id="letters-sheet" data-stage="letters" hidden>
          <div class="sheet-meta">
            <label>Size
              <select id="letters-paper">
                <option value="A5" selected>A5</option>
                <option value="A4">A4</option>
                <option value="Letter">Letter</option>
                <option value="A3">A3</option>
                <option value="Card">Card</option>
              </select>
            </label>
            <label>Orientation
              <select id="letters-orientation">
                <option value="portrait" selected>Portrait</option>
                <option value="landscape">Landscape</option>
              </select>
            </label>
            <span class="margin-label">Margins</span>
            <label>L <input id="margin-left" type="number" min="0" step="1" value="18" /></label>
            <label>T <input id="margin-top" type="number" min="0" step="1" value="18" /></label>
            <label>R <input id="margin-right" type="number" min="0" step="1" value="18" /></label>
            <label>B <input id="margin-bottom" type="number" min="0" step="1" value="18" /></label>
          </div>
          <div class="paper-sheet" id="paper-frame">
            <canvas id="letters-emu" width="740" height="1050"></canvas>
            <div class="print-limit" id="print-limit" aria-hidden="true"></div>
          </div>
        </div>

        <!-- Portrait segments -->
        <div class="sheet-wrap" id="portrait-sheet" data-stage="portrait" hidden>
          <div class="paper-sheet portrait-src-sheet" id="portrait-src-sheet" data-seg-view="source" hidden>
            <canvas id="portrait-src" width="480" height="640"></canvas>
          </div>
          <div class="paper-sheet portrait-ingest-sheet" id="portrait-ingest-frame" data-seg-view="ingest" hidden>
            <canvas id="portrait-ingest" width="480" height="640"></canvas>
          </div>
          <div class="paper-sheet" id="portrait-frame" data-seg-view="vector">
            <canvas id="portrait-emu" width="480" height="640"></canvas>
          </div>
          <div class="ingest-toggles" id="ingest-toggles" hidden>
            <label><input type="checkbox" id="toggle-edges" checked /> Edges</label>
            <label><input type="checkbox" id="toggle-hatch" checked /> Hatch</label>
            <label><input type="checkbox" id="toggle-regions" checked /> Regions</label>
            <label><input type="checkbox" id="toggle-crop" checked /> Crop</label>
            <label>Underlay
              <select id="ingest-underlay">
                <option value="scan">Scan</option>
                <option value="tone">Tone grid</option>
                <option value="photo">Photo</option>
                <option value="none">None</option>
              </select>
            </label>
            <a id="portrait-dl-ingest-svg" href="#" hidden>Raw SVG</a>
            <p class="muted" id="scan-mode-hint"></p>
          </div>
        </div>

        <!-- Hidden lab compare canvases (still used by GenArt ingest) -->
        <div id="lab-compare" hidden>
          <canvas id="lab-src" width="360" height="480"></canvas>
          <canvas id="lab-ingest" width="360" height="480"></canvas>
          <div class="lab-vector-pane"></div>
        </div>
      </div>

      <div class="stage-toolbar">
        <div class="seg zoom-bar" id="zoom-bar">
          <button type="button" id="zoom-out" title="Zoom out">−</button>
          <button type="button" id="zoom-fit" title="Fit">Fit</button>
          <button type="button" id="zoom-in" title="Zoom in">+</button>
          <button type="button" id="loupe" title="Loupe (L)">Loupe</button>
          <span class="zoom-label" id="zoom-label">1.00×</span>
        </div>
        <div class="transport" id="transport">
          <button type="button" class="btn" id="play">Play</button>
          <button type="button" class="btn" id="pause">Pause</button>
          <button type="button" class="btn" id="skip">End</button>
          <label class="speed-label">Speed <input id="speed" type="range" min="1" max="60" value="16" /></label>
          <label class="chk"><input id="ghost" type="checkbox" checked /> Ghost</label>
        </div>
        <div class="export-menu">
          <details id="export-details">
            <summary class="btn">Export…</summary>
            <div class="export-panel">
              <button type="button" class="btn" id="export-pack" disabled>Pack JSON</button>
              <button type="button" class="btn" id="export-settings" disabled>Settings</button>
              <button type="button" class="btn" id="export-layers" disabled>Layers</button>
              <button type="button" class="btn" id="export-motion" disabled>Motion</button>
              <button type="button" class="btn" id="export-palette" disabled>Palette</button>
              <button type="button" class="btn" id="copy-json" disabled>Copy JSON</button>
              <a id="download-svg" class="btn link" href="#" hidden>SVG</a>
              <button type="button" class="btn btn-primary" id="letters-dl-svg" disabled>SVG</button>
              <button type="button" class="btn" id="letters-dl-motion" disabled>Motion</button>
              <button type="button" class="btn" id="letters-dl-pack" disabled>Pack</button>
              <button type="button" class="btn btn-primary" id="portrait-dl-svg" disabled>SVG</button>
              <button type="button" class="btn" id="portrait-dl-motion" disabled>Motion</button>
              <button type="button" class="btn" id="portrait-dl-pack" disabled>Pack</button>
            </div>
          </details>
        </div>
      </div>
    </section>
  </main>

  <!-- Compatibility aliases for legacy id lookups -->
  <div hidden aria-hidden="true">
    <div id="letters-stats"></div>
    <div id="portrait-stats"></div>
    <button type="button" id="letters-play"></button>
    <button type="button" id="letters-pause"></button>
    <button type="button" id="letters-skip"></button>
    <input id="letters-speed" type="range" min="1" max="60" value="16" />
    <button type="button" id="portrait-play"></button>
    <button type="button" id="portrait-pause"></button>
    <button type="button" id="portrait-skip"></button>
    <input id="portrait-speed" type="range" min="1" max="60" value="16" />
    <button type="button" id="letters-zoom-out"></button>
    <button type="button" id="letters-zoom-fit"></button>
    <button type="button" id="letters-zoom-in"></button>
    <button type="button" id="letters-loupe"></button>
    <span id="letters-zoom-label"></span>
    <button type="button" id="portrait-zoom-out"></button>
    <button type="button" id="portrait-zoom-fit"></button>
    <button type="button" id="portrait-zoom-in"></button>
    <button type="button" id="portrait-loupe"></button>
    <span id="portrait-zoom-label"></span>
    <button type="button" id="lab-zoom-out"></button>
    <button type="button" id="lab-zoom-fit"></button>
    <button type="button" id="lab-zoom-in"></button>
    <button type="button" id="lab-loupe"></button>
    <span id="lab-zoom-label"></span>
  </div>

  <script src="/static/emulator.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
