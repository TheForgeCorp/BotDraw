<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BotDraw Emulator</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="bg"></div>
  <header class="top">
    <div class="brand">
      <span class="mark">BotDraw</span>
      <span class="tag">software-first plotter lab</span>
    </div>
    <nav class="tabs" id="tabs">
      <button data-app="genartbot" class="active">GenArtBot</button>
      <button data-app="portraitbot">PortraitBot</button>
      <button data-app="lettersbot">LettersBot</button>
      <button data-app="rdlab">R&amp;D Lab</button>
      <button data-app="tools">Tools</button>
    </nav>
  </header>

  <main class="layout">
    <section class="panel controls" id="controls"></section>
    <section class="panel stage">
      <div class="stage-head">
        <h2 id="stage-title">Emulator</h2>
        <div class="stats" id="stats">Ready</div>
      </div>
      <canvas id="emu" width="900" height="1200"></canvas>
      <div class="transport">
        <button id="play">Play</button>
        <button id="pause">Pause</button>
        <button id="skip">Skip end</button>
        <label>Speed <input id="speed" type="range" min="1" max="40" value="12" /></label>
        <a id="download-svg" class="link" href="#" hidden>Download SVG</a>
      </div>
    </section>
  </main>

  <script src="/static/emulator.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
