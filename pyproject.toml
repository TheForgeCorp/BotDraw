[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "botdraw"
version = "0.1.0"
description = "Software-first multi-bot pen plotter platform with emulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "numpy>=1.26.0",
  "Pillow>=10.0.0",
  "shapely>=2.0.0",
  "svgwrite>=1.4.3",
  "typer>=0.12.0",
  "rich>=13.0.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "vtracer>=0.6.0",
]

[project.optional-dependencies]
optimize = ["vpype>=1.14.0"]
neural = ["onnxruntime>=1.20.0"]
vision = [
  "anthropic>=0.40.0",
  "openai>=1.40.0",
  "google-genai>=1.0.0",
]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[project.scripts]
botdraw = "botdraw.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["botdraw*"]

[tool.setuptools.package-data]
botdraw = [
  "schemas/*.json",
  "palettes/presets/*.json",
  "paper/presets/*.json",
  "lines/presets/*.json",
  "letters/corpus/*.json",
  "letters/fonts/*.json",
  "letters/fonts/**/*.json",
  "web/*",
]
